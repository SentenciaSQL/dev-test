spring:
  application:
    name: apptrial-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/apptrial}
    username: ${DATABASE_USER:apptrial}
    password: ${DATABASE_PASSWORD:apptrial}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

apptrial:
  security:
    jwt-secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-256-bits-long!!}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  mail:
    from: ${MAIL_FROM:noreply@apptrial.local}
  billing:
    # Google Play package name of THIS platform app (not tester target apps)
    package-name: ${PLAY_PACKAGE_NAME:com.apptrial.mobile}
  credits:
    free-initial-grant: 20
    default-group-size: 15
    min-group-size: 12

logging:
  level:
    root: INFO
    com.apptrial: INFO
