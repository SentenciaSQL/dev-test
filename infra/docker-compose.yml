services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apptrial
      POSTGRES_USER: apptrial
      POSTGRES_PASSWORD: apptrial
    ports:
      - "5432:5432"
    volumes:
      - apptrial_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apptrial -d apptrial"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - apptrial_s3:/var/lib/localstack

volumes:
  apptrial_pg:
  apptrial_s3:
